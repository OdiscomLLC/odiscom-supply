name: Publish Azure TEST smoke container image
on:
  push:
    branches:
      - deploy/azure-container-apps-test-20261020
    paths:
      - .github/workflows/azure-test-publish.yml

permissions:
  contents: read
  packages: write

jobs:
  publish-smoke-image:
    name: Validate and publish TEST smoke image (no database credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.repository == 'OdiscomLLC/odiscom-supply' && github.ref == 'refs/heads/deploy/azure-container-apps-test-20261020'
    steps:
      - name: Check out isolated TEST branch
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and test
        run: |
          npm ci
          npm test
          npm run build
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image (no production credentials)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/odiscomllc/odiscom-supply:azure-test-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/OdiscomLLC/odiscom-supply
            org.opencontainers.image.description=Odiscom Supply Azure TEST smoke-only image, without connected business data
      - name: Report published image
        run: echo "Image ghcr.io/odiscomllc/odiscom-supply:azure-test-${GITHUB_SHA}"
