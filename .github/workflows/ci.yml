name: Application checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Validate Azure Bicep without credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Compile Azure TEST foundation
        run: |
          set -euo pipefail
          az bicep build --file infra/main.bicep --stdout > /tmp/odiscom-supply-main.json
          test -s /tmp/odiscom-supply-main.json
          python3 -m json.tool /tmp/odiscom-supply-main.json > /dev/null
