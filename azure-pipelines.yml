trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '22.x'
  bicepFile: 'infra/main.bicep'
  functionsDirectory: 'azure/functions'
  # Configure these in Azure DevOps variable groups/environment settings.
  # azureServiceConnection: '<service-connection-name>'
  # resourceGroupName: '<odiscom-supply-resource-group>'
  # environmentName: 'test'
  # sqlEntraAdminLogin: '<entra-group-display-name>'
  # sqlEntraAdminObjectId: '<entra-group-object-id>'
  # sqlBootstrapPassword: secret variable only
  # ODISCOM_TEST_DEPLOYMENT_APPROVED: set to 'true' only for a reviewed TEST run
  # ODISCOM_APPROVED_SUBSCRIPTION_ID, ODISCOM_APPROVED_TENANT_ID and ODISCOM_TEST_RESOURCE_GROUP: approved identifiers

stages:
  - stage: Validate
    displayName: Validate Microsoft foundation
    jobs:
      - job: ValidateInfrastructure
        displayName: Validate Bicep
        pool:
          vmImage: ubuntu-latest
        steps:
          # Compilation is a local operation: do not require Azure credentials here.
          # The service connection is intentionally reserved for manual TEST plan/deploy.
          - script: |
              set -euo pipefail
              az bicep install
              az bicep build --file "$(bicepFile)" --stdout > /tmp/odiscom-supply-foundation.json
              test -s /tmp/odiscom-supply-foundation.json
              python3 -m json.tool /tmp/odiscom-supply-foundation.json > /dev/null
            displayName: Build Bicep (no Azure service connection)

      - job: ValidateFunctions
        displayName: Validate Azure Functions
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseNode@1
            inputs:
              version: '$(nodeVersion)'
          - script: |
              set -euo pipefail
              cd "$(functionsDirectory)"
              npm install --ignore-scripts
              npm test
            displayName: Install and test Functions package

  # Azure deployment is opt-in only: explicitly queue a manual run with the
  # reviewed scope variables and approval flag. A normal push only validates.
  - stage: PlanTest
    displayName: Review Azure TEST infrastructure what-if
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'), eq(variables['ODISCOM_TEST_DEPLOYMENT_APPROVED'], 'true'))
    jobs:
      - job: PlanFoundation
        displayName: Verify identity and plan changes
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Verify TEST scope and perform what-if
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az account show --output json | node scripts/microsoft/assert-azure-test-context.mjs
                az deployment group what-if \
                  --resource-group "$ODISCOM_TEST_RESOURCE_GROUP" \
                  --template-file "$(bicepFile)" \
                  --parameters \
                    environment=test \
                    sqlEntraAdminLogin="$SQL_ENTRA_ADMIN_LOGIN" \
                    sqlEntraAdminObjectId="$SQL_ENTRA_ADMIN_OBJECT_ID" \
                    sqlBootstrapPassword="$SQL_BOOTSTRAP_PASSWORD"
            env:
              ODISCOM_APPROVED_SUBSCRIPTION_ID: $(ODISCOM_APPROVED_SUBSCRIPTION_ID)
              ODISCOM_APPROVED_TENANT_ID: $(ODISCOM_APPROVED_TENANT_ID)
              ODISCOM_TEST_RESOURCE_GROUP: $(resourceGroupName)
              ODISCOM_TEST_DEPLOYMENT_APPROVED: $(ODISCOM_TEST_DEPLOYMENT_APPROVED)
              SQL_ENTRA_ADMIN_LOGIN: $(sqlEntraAdminLogin)
              SQL_ENTRA_ADMIN_OBJECT_ID: $(sqlEntraAdminObjectId)
              SQL_BOOTSTRAP_PASSWORD: $(sqlBootstrapPassword)

  - stage: DeployTest
    displayName: Deploy approved Azure TEST foundation
    dependsOn: PlanTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'), eq(variables['ODISCOM_TEST_DEPLOYMENT_APPROVED'], 'true'))
    jobs:
      # Configure Azure DevOps Environment "odiscom-supply-test" approvals/checks
      # before ever setting the approval flag to true.
      - deployment: DeployFoundation
        displayName: Deploy reviewed TEST infrastructure
        environment: 'odiscom-supply-test'
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Revalidate TEST scope immediately before deployment
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az account show --output json | node scripts/microsoft/assert-azure-test-context.mjs
                      az deployment group create \
                        --resource-group "$ODISCOM_TEST_RESOURCE_GROUP" \
                        --template-file "$(bicepFile)" \
                        --parameters \
                          environment=test \
                          sqlEntraAdminLogin="$SQL_ENTRA_ADMIN_LOGIN" \
                          sqlEntraAdminObjectId="$SQL_ENTRA_ADMIN_OBJECT_ID" \
                          sqlBootstrapPassword="$SQL_BOOTSTRAP_PASSWORD" \
                        --name "odiscom-supply-$(Build.BuildId)"
                  env:
                    ODISCOM_APPROVED_SUBSCRIPTION_ID: $(ODISCOM_APPROVED_SUBSCRIPTION_ID)
                    ODISCOM_APPROVED_TENANT_ID: $(ODISCOM_APPROVED_TENANT_ID)
                    ODISCOM_TEST_RESOURCE_GROUP: $(resourceGroupName)
                    ODISCOM_TEST_DEPLOYMENT_APPROVED: $(ODISCOM_TEST_DEPLOYMENT_APPROVED)
                    SQL_ENTRA_ADMIN_LOGIN: $(sqlEntraAdminLogin)
                    SQL_ENTRA_ADMIN_OBJECT_ID: $(sqlEntraAdminObjectId)
                    SQL_BOOTSTRAP_PASSWORD: $(sqlBootstrapPassword)
